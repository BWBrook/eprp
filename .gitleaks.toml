# Citation keys in generated bibliographies (citation-key: authorYearTitleWords) trip generic-api-key.
# The exemption matches only key-name matches of that shape, so provider-token rules still apply to the rest
# of every file, including the bibliography.
[extend]
useDefault = true

[allowlist]
description = "Citation keys (authorYearTitleWords) in generated CSL-YAML bibliographies"
regexTarget = "match"
regexes = ['''key:\s*[a-z]+\d{4}[A-Z][A-Za-z0-9]*''']
