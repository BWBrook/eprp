# Exact-match allowlist for the verified public citation keys in papers/infrastructure-audit/references/refs.yaml.
# When a DOI is added there, review the generated key and add it here exactly; other generic-key matches stay detected.
[extend]
useDefault = true

[allowlist]
description = "Exact verified citation-key matches"
regexTarget = "match"
regexes = ['''^key:\s*(?:benson2025MarineAnimalDiversity|bradshaw2012RobustEstimatesExtinction|fenton2021TritonSpecieslevelDatabase|herrerogascon2026Inditek20|matthews2016GlobalPlateBoundary|merdith2021ExtendingFullplateTectonic|monarrez2023ReducedStrengthIncreased|rampino2025CorrelationCyclicityStratigraphic|renaudie2020NsbNeptuneSandbox|silvestro2014PyrateProgramEstimate|smith2025IdentifyingBigQuestions|strauss1989ClassicalConfidenceIntervals)$''']
