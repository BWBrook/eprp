# Exact-match allowlist for the verified public citation keys in papers/infrastructure-audit/references/refs.yaml.
# When a DOI is added there, review the generated key and add it here exactly; other generic-key matches stay detected.
[extend]
useDefault = true

[allowlist]
description = "Exact verified citation-key matches"
regexTarget = "match"
regexes = ['''^key:\s*(?:alroy2008PhanerozoicTrendsGlobal|benson2025MarineAnimalDiversity|benton1993FossilRecord2|bradshaw2012RobustEstimatesExtinction|fenton2021TritonSpecieslevelDatabase|herrerogascon2026Inditek20|matthews2016GlobalPlateBoundary|merdith2021ExtendingFullplateTectonic|monarrez2023ReducedStrengthIncreased|rampino2025CorrelationCyclicityStratigraphic|raup1972TaxonomicDiversityPhanerozoic|renaudie2020NsbNeptuneSandbox|robson1964EstimationTruncationPoint|scotese2016PaleomapPaleoatlasGplates|silvestro2014PyrateProgramEstimate|smith2001LargescaleHeterogeneityFossil|smith2025IdentifyingBigQuestions|strauss1989ClassicalConfidenceIntervals|vanhinsbergen2015PaleolatitudeCalculatorPaleoclimate|yesson2007HowGlobalGlobal)$''']
