<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="111mm" viewBox="0 0 1700 1110">
  <title>Graphical abstract: AI agents audit the shared foundations of fossil science</title>
  <desc>Hand-written SVG by Claude (Anthropic), 12 November 2026. Numbers trace to manuscript/claims.csv:
  C191 (71,103 of 368,760), C076 (460), C125 (13.6 degrees at 400 Ma), C096 (3,972 of 8,282),
  C190 (0.316 against 3.4e-16). Render from manuscript/: inkscape graphical-abstract/graphical_abstract.svg --export-type=png --export-dpi=300 --export-filename=figures/graphical_abstract.png (and --export-type=pdf --export-text-to-path for the PDF)</desc>
  <style>
    text { font-family: 'IBM Plex Sans', 'DejaVu Sans', sans-serif; fill: #1f1f1e; }
    .muted { fill: #5f5e58; }
    .title { font-size: 54px; font-weight: 600; }
    .sub { font-size: 28px; }
    .lab { font-size: 27px; text-anchor: middle; }
    .kick { font-size: 21px; font-weight: 600; letter-spacing: 2.5px; }
    .big { font-size: 60px; font-weight: 600; text-anchor: middle; }
    .card { font-size: 26px; text-anchor: middle; }
    .stat { font-size: 66px; font-weight: 600; }
    .body { font-size: 26px; }
    .ico { fill: none; stroke: #1f1f1e; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8982"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7f62"/>
    </marker>
  </defs>

  <rect width="1700" height="1110" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="66" class="title">AI agents audit the shared foundations of fossil science</text>
  <text x="40" y="114" class="sub muted">Twelve findings from one research program, each re-checked from fixed, checksummed inputs</text>

  <!-- Audited region -->
  <rect x="292" y="148" width="1376" height="308" rx="22" fill="#e6f4ef"/>
  <text x="318" y="186" class="kick" fill="#0f7f62" style="fill:#0f7f62">CHECKED AGAINST SOURCES, KNOWN ANSWERS AND RECOMPUTATION</text>

  <g transform="translate(0,32)">
<!-- Chain connectors -->
  <g stroke="#8a8982" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="206" y1="250" x2="350" y2="250"/>
    <line x1="486" y1="250" x2="630" y2="250"/>
    <line x1="766" y1="250" x2="910" y2="250"/>
    <line x1="1046" y1="250" x2="1190" y2="250"/>
    <line x1="1326" y1="250" x2="1470" y2="250"/>
  </g>

  <!-- Stations -->
  <g fill="#ffffff" stroke="#c9c8c0" stroke-width="2">
    <circle cx="140" cy="250" r="60" fill="#f4f3ef"/>
    <circle cx="420" cy="250" r="60"/>
    <circle cx="700" cy="250" r="60"/>
    <circle cx="980" cy="250" r="60"/>
    <circle cx="1260" cy="250" r="60"/>
    <circle cx="1540" cy="250" r="60"/>
  </g>

  <!-- Icon: ammonite -->
  <path class="ico" d="M140,252 a5,5 0 0 1 10,0 a10,10 0 0 1 -20,0 a15,15 0 0 1 30,0 a20,20 0 0 1 -40,0 a25,25 0 0 1 50,0 a30,30 0 0 1 -60,0"/>
  <!-- Icon: database -->
  <g class="ico">
    <ellipse cx="420" cy="226" rx="30" ry="10"/>
    <path d="M390,226 v48 a30,10 0 0 0 60,0 v-48"/>
    <path d="M390,250 a30,10 0 0 0 60,0"/>
  </g>
  <!-- Icon: strata (time scale) -->
  <g stroke="#1f1f1e" stroke-width="2.4" stroke-linejoin="round">
    <path d="M664,224 q18,-8 36,0 t36,0 v14 q-18,8 -36,0 t-36,0 z" fill="#d9d8d2"/>
    <path d="M664,238 q18,8 36,0 t36,0 v14 q-18,-8 -36,0 t-36,0 z" fill="#f4f3ef"/>
    <path d="M664,252 q18,-8 36,0 t36,0 v14 q-18,8 -36,0 t-36,0 z" fill="#bdbcb3"/>
    <path d="M664,266 q18,8 36,0 t36,0 v12 h-72 z" fill="#e8e6df"/>
  </g>
  <circle cx="712" cy="245" r="4" fill="#1f1f1e"/>
  <!-- Icon: globe -->
  <g class="ico">
    <circle cx="980" cy="250" r="33"/>
    <ellipse cx="980" cy="250" rx="14" ry="33" stroke-width="2"/>
    <path d="M950,236 q30,8 60,0 M950,264 q30,-8 60,0" stroke-width="2"/>
  </g>
  <g>
    <line x1="966" y1="230" x2="992" y2="268" stroke="#eb6834" stroke-width="2.4" stroke-dasharray="3 4"/>
    <circle cx="966" cy="230" r="6" fill="#eb6834"/>
    <circle cx="992" cy="268" r="6" fill="#ffffff" stroke="#eb6834" stroke-width="3"/>
  </g>
  <!-- Icon: code -->
  <g class="ico">
    <polyline points="1244,232 1226,250 1244,268"/>
    <polyline points="1276,232 1294,250 1276,268"/>
    <line x1="1266" y1="226" x2="1254" y2="274"/>
  </g>
  <!-- Icon: published result -->
  <g class="ico">
    <path d="M1516,216 h34 l14,14 v54 h-48 z"/>
    <polyline points="1524,272 1534,260 1542,266 1556,244" stroke-width="3"/>
  </g>

  </g>

  <!-- Station labels -->
  <text x="140" y="400" class="lab">Fossils</text>
  <text x="420" y="400" class="lab">Databases and</text>
  <text x="420" y="432" class="lab">data files</text>
  <text x="700" y="400" class="lab">Time scales and</text>
  <text x="700" y="432" class="lab">age models</text>
  <text x="980" y="400" class="lab">Maps of past</text>
  <text x="980" y="432" class="lab">continents</text>
  <text x="1260" y="400" class="lab">Analysis</text>
  <text x="1260" y="432" class="lab">software</text>
  <text x="1540" y="400" class="lab">Published</text>
  <text x="1540" y="432" class="lab">results</text>

  <!-- Card connectors -->
  <g stroke="#eb6834" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="420" y1="460" x2="420" y2="492"/>
    <line x1="700" y1="460" x2="700" y2="492"/>
    <line x1="980" y1="460" x2="980" y2="492"/>
    <line x1="1260" y1="460" x2="1260" y2="492"/>
    <line x1="1540" y1="460" x2="1540" y2="492"/>
  </g>

  <!-- Finding cards -->
  <g fill="#fdf1eb">
    <rect x="288" y="496" width="264" height="302" rx="14"/>
    <rect x="568" y="496" width="264" height="302" rx="14"/>
    <rect x="848" y="496" width="264" height="302" rx="14"/>
    <rect x="1128" y="496" width="264" height="302" rx="14"/>
    <rect x="1408" y="496" width="264" height="302" rx="14"/>
  </g>
  <g fill="#eb6834">
    <rect x="288" y="496" width="264" height="7" rx="3"/>
    <rect x="568" y="496" width="264" height="7" rx="3"/>
    <rect x="848" y="496" width="264" height="7" rx="3"/>
    <rect x="1128" y="496" width="264" height="7" rx="3"/>
    <rect x="1408" y="496" width="264" height="7" rx="3"/>
  </g>

  <text x="420" y="580" class="big">1 in 5</text>
  <text x="420" y="636" class="card">mollusk records in</text>
  <text x="420" y="670" class="card">one study's deposit</text>
  <text x="420" y="704" class="card">absent from a dated</text>
  <text x="420" y="738" class="card">public snapshot</text>

  <text x="700" y="580" class="big">460</text>
  <text x="700" y="636" class="card">interval ages that</text>
  <text x="700" y="670" class="card">shifted between two</text>
  <text x="700" y="704" class="card">database downloads</text>

  <text x="980" y="580" class="big">13.6°</text>
  <text x="980" y="636" class="card">median spread in</text>
  <text x="980" y="670" class="card">ancient latitude of</text>
  <text x="980" y="704" class="card">tested sites among</text>
  <text x="980" y="738" class="card">three maps, 400</text>
  <text x="980" y="772" class="card">million years ago</text>

  <text x="1260" y="580" class="big">3,972</text>
  <text x="1260" y="636" class="card">of 8,282 layer</text>
  <text x="1260" y="670" class="card">positions given the</text>
  <text x="1260" y="704" class="card">wrong age in a test</text>
  <text x="1260" y="738" class="card">with known answers</text>

  <text x="1540" y="578" class="big" style="font-size:46px">3.4×10<tspan baseline-shift="super" style="font-size:28px">−16</tspan></text>
  <text x="1540" y="636" class="card">a printed</text>
  <text x="1540" y="670" class="card">probability; its</text>
  <text x="1540" y="704" class="card">own stated test</text>
  <text x="1540" y="738" class="card">gives 0.32</text>

  <!-- Method column under Fossils -->
  <g>
    <circle cx="92" cy="556" r="34" fill="#0f7f62"/>
    <circle cx="192" cy="556" r="34" fill="#0f7f62"/>
    <text x="92" y="565" style="font-size:25px;font-weight:600;fill:#ffffff;text-anchor:middle">AI</text>
    <text x="192" y="565" style="font-size:25px;font-weight:600;fill:#ffffff;text-anchor:middle">AI</text>
    <path d="M116,532 q26,-24 52,0" fill="none" stroke="#0f7f62" stroke-width="2.8" marker-end="url(#arrT)"/>
    <path d="M168,580 q-26,24 -52,0" fill="none" stroke="#0f7f62" stroke-width="2.8" marker-end="url(#arrT)"/>
    <text x="142" y="650" class="card">two AI agents find,</text>
    <text x="142" y="684" class="card">then re-check each</text>
    <text x="142" y="718" class="card">from fixed inputs</text>
  </g>

  <!-- Bottom panel -->
  <rect x="32" y="834" width="1636" height="244" rx="18" fill="#f4f3ef"/>
  <line x1="566" y1="862" x2="566" y2="1050" stroke="#d9d8d2" stroke-width="2"/>
  <line x1="1112" y1="862" x2="1112" y2="1050" stroke="#d9d8d2" stroke-width="2"/>

  <text x="62" y="918" class="stat">12</text>
  <text x="160" y="896" class="body">findings, each with its</text>
  <text x="160" y="930" class="body">evidence and the command</text>
  <text x="160" y="964" class="body">that reproduces it</text>
  <text x="62" y="1036" class="body muted">across data, code, models and meaning</text>

  <text x="598" y="918" class="stat" style="fill:#0f7f62">6</text>
  <text x="660" y="896" class="body">of the agents' own first</text>
  <text x="660" y="930" class="body">accounts were corrected</text>
  <text x="660" y="964" class="body">by the re-check</text>
  <text x="598" y="1036" class="body muted">the auditors were audited too</text>

  <text x="1144" y="892" class="kick" style="fill:#1f1f1e">WHAT RESEARCHERS CAN DO</text>
  <circle cx="1152" cy="936" r="6" fill="#eb6834"/>
  <text x="1172" y="945" class="body">Record download dates and versions</text>
  <circle cx="1152" cy="984" r="6" fill="#eb6834"/>
  <text x="1172" y="993" class="body">Compare more than one model</text>
  <circle cx="1152" cy="1032" r="6" fill="#eb6834"/>
  <text x="1172" y="1041" class="body">Recompute a number before reuse</text>
</svg>
